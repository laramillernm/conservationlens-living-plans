project:
  name: ConservationLens Living Plans
  version: "0.1"

planning_area:
  name: El Rito Watershed
  type: huc10
  source: data/boundaries/el_rito_boundary.geojson

  huc:
    unit: huc10
    id: "1302010211"
    name: El Rito

    parent:
      unit: huc8
      id: "13020102"
      name: Rio Chama

planning_period:
  baseline_year: 2020
  current_year: 2026

questions:
  - What is exposed?
  - What work has been completed?
  - What important need remains?
  - What has changed since the planning baseline?

analysis_areas:

  watershed_analysis_area:
    method: planning_huc
    unit: huc10

    purpose: >
      Uses the configured planning HUC as the primary watershed
      analysis geography.

  hydrologic_context:
    method: adjacent_huc12_network

    include:
      - immediate_upstream_huc12
      - immediate_downstream_huc12

    upstream_levels: 1
    downstream_levels: 1

    search_limit:
      parent_unit: huc8

    purpose: >
      Adds immediately upstream HUC12 watersheds outside the
      planning HUC that drain directly into the planning area,
      as well as the first downstream HUC12 that receives flow
      from the planning area. This provides bounded hydrologic
      context for evaluating post-fire runoff, erosion, sediment,
      and debris-flow consequences.

  fire_context:
    method: buffer
    distance_km: 20

    purpose: >
      Provides broader landscape context for fire occurrence,
      fire-size distribution, and fire-regime analysis.

  treatment_context:
    method: planning_plus_hydrologic_context

    include:
      - planning_area
      - hydrologic_context

    purpose: >
      Defines the broader landscape where forest treatment could
      reduce wildfire effects, protect watershed values, reduce
      post-fire consequences, or reinforce previous treatments.

fire_regime:

  historical_period:
    start: 2005
    end: 2014

  recent_period:
    start: 2015
    end: 2024

  occurrence_context_buffer_km: 20